<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Internal Error — {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body style="background:var(--color-background); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:var(--space-6);">
  <div class="card" style="max-width:480px; text-align:center; padding:var(--space-10);">
    <div style="width:64px; height:64px; border-radius:50%; background:var(--color-danger-soft); color:var(--color-danger); display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-4);">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
    </div>
    <span class="badge badge-danger" style="margin-bottom:var(--space-2);">500 Server Error</span>
    <h1 style="font-size:22px; font-weight:700; color:var(--color-text); margin-bottom:var(--space-2);">Unexpected Error</h1>
    <p style="font-size:14px; color:var(--color-text-secondary); margin-bottom:var(--space-6); line-height:1.5;">
      An unexpected internal server error occurred. The technical details have been logged for administrative investigation.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="width:100%;">
      Return to Home
    </a>
  </div>
</body>
</html>
